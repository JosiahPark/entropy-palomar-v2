version: v0.4

project:
  name: Dimension-free exponential entropy quotients over F₂
  description: >-
    Formalization of dimension-independent exponential entropy-quotient bounds
    for laws on finite vector spaces over F₂. For every ε > 0 a subspace of
    dimension at most 2^(320(1+ε)/ε) H(X) makes the quotient entropy at most
    (1+ε) times its independent-doubling entropy increment, which does not
    exceed the original increment. The development also proves logarithmic
    rigidity for sparse laws and finite weighted families, necessity of
    exponential dependence on 1/ε, two-input almost-additivity, and concentration
    of moderate-doubling sets on subspace cosets. Entropies are in bits. The
    entropic Marton input is obtained from the pinned PFR formalization through
    a proved translation to probability mass functions. The selected results
    are Theorems 1.1, 1.2 and 8.2, Proposition 9.3, and Corollaries 9.2 and 9.4
    of arXiv:2610.38525v1; no optimality of the constant 320 is claimed.
  authors:
    - Josiah Park
  responsible_maintainers:
    - Josiah Park
  license: MIT

classification:
  arxiv: [math.CO, cs.IT]
  msc2020: [11B30, 94A17]

sources:
  - title: Dimension-free exponential entropy quotients over F₂
    authors: [Josiah Park]
    id: https://arxiv.org/abs/2610.38525v1
    type: paper
    location: Theorems 1.1, 1.2, 8.2; Proposition 9.3; Corollaries 9.2, 9.4
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The source PDF is included at paper/2610.38525v1.pdf. Its statements and
      the explicit definitions in Challenge.lean determine the advertised scope.
  - title: On a conjecture of Marton
    authors: [W. T. Gowers, Ben Green, Freddie Manners, Terence Tao]
    id: https://arxiv.org/abs/2311.05762v1
    type: paper
    location: Theorem 1.2 and Lemma A.2
    relationship: background
    note: >-
      Source of the entropic polynomial Freiman–Ruzsa input and entropy framework.
      The Lean proof imports PFR's improved entropic theorem and weakens the
      resulting one-variable constant 5 to the paper's constant 6.
  - title: Improved PFR
    id: https://github.com/teorth/pfr/blob/ebe2d96230b1abb190f74592aace441a0f10fe09/PFR/ImprovedPFR.lean
    type: other
    relationship: background
    note: >-
      The pinned PFR development implements the improved bound attributed in its
      README to Jyun-Jie Liao. EntropyLean.PFRBridge uses
      entropic_PFR_conjecture_improv; this external proof is not original work
      of the present repository.

related_formalizations:
  - id: https://github.com/teorth/pfr/tree/ebe2d96230b1abb190f74592aace441a0f10fe09
    relationship: builds-on
    note: >-
      The PFR proof supplies the entropic Marton theorem. PFRBridge proves the
      translation from random variables and entropy in nats to PMFs and entropy
      in bits. Its proof is imported, not replaced by an axiom.
  - id: https://github.com/leanprover-community/mathlib4/tree/56a005855ea17e0b0958f73ec801ae140b0a1679
    relationship: builds-on
    note: >-
      Mathlib supplies probability mass functions, real logarithms, finite
      linear algebra, topology, and proof automation. Challenge imports only
      this canonical Mathlib dependency and its pinned dependency closure.

status:
  scope: >-
    comparator.json selects seven declarations re-exported by Solution.lean.
    These are the main paper results listed in alignment below; the supporting
    results and constant improvements elsewhere are not additional registered
    claims. Solution checks all seven transitive axiom closures at compilation.
    The unrelated FeatureMap stub has 2 textual sorry occurrences, and archive/
    and missing/ contain 45 more. The conservative sorry_count below counts all
    47 occurrences outside Challenge, including these unselected historical
    drafts; it does not assert 47 gaps in the selected proof graph. Challenge's
    seven intentional theorem placeholders are excluded. Historical drafts are
    not build targets, and no correctness claim is made for them. The listed
    axioms are the permitted axioms for the selected results.
  sorry_count: 47
  axioms: [propext, Classical.choice, Quot.sound]

