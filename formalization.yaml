      models: [Claude Fable 5.2, Claude Opus 5.5]
      framework: Claude Code and Claude desktop sessions
      tool_setup: >-
        AI-assisted Lean proof development and repairs, as documented in
        ROADMAP.md and the repository commit history. These model names are
        recorded in commit trailers; not every historical session is recoverable.
    - method: agent
      models: [Grok (version not recorded)]
      framework: Grok tasks
      tool_setup: >-
        Numerical diagnostics and parallel formalization attempts documented in
        numerics/ and docs/PARALLEL_EFFORTS.md. Numerical outputs are not proof
        premises and the independent draft attempts are not substitutes for
        the compiled EntropyLean proofs.
    - method: other
      models: [OpenAI GPT-6 Astra]
      framework: OpenAI tools
      tool_setup: >-
        The source manuscript acknowledges extensive assistance with informal
        proof development, checking, literature retrieval, drafting, and
        computational diagnostics. This is source-manuscript provenance.
    - method: agent
      models: [OpenAI Codex (exact model version not recorded)]
      framework: ChatGPT Work Mode
      tool_setup: >-
        Palomar submission packaging, module-system migration, metadata,
        independent statement transcription, validation workflow, and local
        checks in November 2026.
  spend_usd: not tracked
  notes: >-
    Josiah Park is the sole human author and responsible maintainer, as confirmed
    for this submission update. AI systems are tools rather than authors.
    Available evidence does not reconstruct every historical model, prompt,
    session, cost, or hardware configuration. No independent human peer review
    is claimed.

fidelity:
  divergences: >-
    Theorems 1.1, 1.2 and 8.2 use arbitrary finite F₂-modules rather than a
    chosen coordinate space. Weighted-family indices are finite types in Type.
    Proposition 9.3 is stated as: for every c < 2, eventually
    c ≤ ε log₂ C(ε) as ε tends to zero from above. This expresses the extended
    liminf lower bound without the junk value of real-valued liminf for an
    unbounded function. The original-input hypothesis uses D(X), as in the
    paper. Corollary 9.4 is represented by two declarations, each existentially
    quantified over a subspace, rather than a single simultaneous conjunction.
    The latter is not claimed by this configuration. Novelty has not been
    independently established, and constant 320 is not claimed to be optimal.

review:
  status: agent-reviewed
  reviewers: [OpenAI Codex]
  notes: >-
    Submission packaging and selected statement transcription were checked
    against the repository and its included source paper. This is not independent
    human mathematical review or Palomar acceptance. Local compilation and
    mechanical evidence, with their limits, are recorded in docs/PALOMAR.md.
    Run the complete pinned Palomar preflight on the exact public commit before
    intake; a local build or standalone Comparator result does not replace it.

